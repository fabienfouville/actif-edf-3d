# Sonde des sources de données, lancée à chaque push sur une branche de travail claude/*.
# Écrit son rapport dans probe/report.json et le commite sur la même branche.
name: Sonde des sources

on:
  push:
    branches: ["claude/**"]
    paths: ["pipeline/**", ".github/workflows/probe.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sonde
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: cd pipeline && python catalog.py && python build_catalog.py
      - name: Commit du rapport
        run: |
          git config user.name "parc3d-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe data/reference.json data/assets.json data/edf_tranches.json
          git diff --cached --quiet || { git commit -m "Catalogue de référence depuis les sources officielles"; git push; }
